name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # build runs typecheck and the package-boundary check first.
      - run: npm run build
      - run: npm test
      - name: Docker image builds
        run: docker build -t renovagent:ci .

  ui:
    # Drives the public pages in Chromium: overflow, accessible names, console
    # errors, budget wording, intake labels/persistence (scripts/ui-check.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run ui:check
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check-screenshots
          path: .local/ui-check/
          retention-days: 14
